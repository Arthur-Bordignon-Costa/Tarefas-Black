<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estudos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 0 10px;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            padding: 8px;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #f4f4f4;
            margin-bottom: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
        }

        .concluida {
            text-decoration: line-through;
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <h2>Controle de Estudos</h2>
    <form id="formDisciplina">
        <input type="text" id="nome" placeholder="Nome da Disciplina" required>
        <input type="number" id="horas" placeholder="Horas Estudadas" min="0" required>
        <button type="submit">Adicionar</button>
    </form>
    <ul id="listaDisciplinas"></ul>
    <script src="app.js"></script>
</body>

</html>
